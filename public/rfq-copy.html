<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Request</title>
<style>
  body{margin:0;background:#f6f6f3;font-family:Arial,Helvetica,sans-serif;color:#16240f}
  .card{max-width:560px;margin:24px auto;background:#fff;border:1px solid #eceae2;border-radius:10px;overflow:hidden}
  .bar{background:#16240f;padding:10px 20px;border-bottom:3px solid #8cc541;display:flex;align-items:center;justify-content:space-between}
  .bar img{height:30px;display:block}
  .bar span{color:#8cc541;font-size:11px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase}
  pre{margin:0;padding:22px 20px 8px;font:15px/1.6 Arial,Helvetica,sans-serif;white-space:pre-wrap;word-break:break-word}
  .btns{padding:14px 20px 22px;display:flex;gap:10px;flex-wrap:wrap}
  button,a.btn{font:bold 14px Arial,Helvetica,sans-serif;padding:11px 18px;border-radius:8px;border:1px solid #16240f;cursor:pointer;text-decoration:none}
  button{background:#16240f;color:#fff}
  a.btn{background:#fff;color:#16240f}
  .err{padding:22px 20px;color:#565b4e}
</style>
</head>
<body>
<div class="card">
  <div class="bar"><img src="/logos/sfp-lockup-light.png" alt="Superfoods Partners"><span>New request</span></div>
  <pre id="t"></pre>
  <div class="btns" id="b" hidden>
    <button id="c" type="button">Copy</button>
    <a class="btn" id="w" href="#">Share on WhatsApp</a>
  </div>
  <div class="err" id="e" hidden>This link has no request attached.</div>
</div>
<script>
(function(){
  // The request travels in the URL fragment (#...), which browsers never send to the server.
  var h=location.hash.slice(1), t="";
  try{
    var s=atob(h.replace(/-/g,"+").replace(/_/g,"/"));
    t=new TextDecoder().decode(Uint8Array.from(s,function(c){return c.charCodeAt(0)}));
  }catch(e){}
  if(!t){document.getElementById("e").hidden=false;return}
  // Labels (wrapped in *...*) are shown bold, values as normal text.
  var pre=document.getElementById("t");
  t.split("\n").forEach(function(line,i){
    if(i)pre.appendChild(document.createTextNode("\n"));
    var m=line.match(/^\*(.+?)\*(.*)$/);
    if(m){var b=document.createElement("strong");b.textContent=m[1];pre.appendChild(b);pre.appendChild(document.createTextNode(m[2]))}
    else pre.appendChild(document.createTextNode(line));
  });
  document.getElementById("b").hidden=false;
  document.getElementById("w").href="https://wa.me/?text="+encodeURIComponent(t);
  var c=document.getElementById("c");
  c.onclick=function(){
    var done=function(){c.textContent="Copied";setTimeout(function(){c.textContent="Copy"},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else{fallback()}
    function fallback(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(a)}
  };
})();
</script>
</body>
</html>
